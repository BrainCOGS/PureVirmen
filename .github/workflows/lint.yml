name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the commits since the base, which needs the history
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # no lockfile to key a cache on, and uvx only fetches prek
          enable-cache: false

      - name: Run prek
        env:
          # gitleaks scans staged changes, of which there are none here: it runs
          # in the next step on the commits of the PR instead
          SKIP: gitleaks
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Scan the commits of the PR (or push) for secrets
        # a manual run has no base to scan from
        if: github.event_name != 'workflow_dispatch'
        env:
          GITLEAKS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uvx prek run gitleaks --all-files --verbose
