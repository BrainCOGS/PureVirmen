# Run with prek (https://github.com/j178/prek) or pre-commit:
#   uv tool install prek && prek install && prek run --all-files
# `prek install` also installs the commit-msg hook (default_install_hook_types).
#
# This repo is mostly MATLAB, so there are no formatters or whitespace fixers:
# the hooks look for secrets, merge conflict markers, workflow problems and
# the AI trailer spelling, and change no files.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, pre-merge-commit, manual]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-merge-conflict
    - id: check-case-conflict

- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
    # Scans only the changes being introduced: the staged changes (or a
    # merge's own changes) on commit, the commits of the PR in CI (lint.yml).
    # Older commits hold known findings that are rotated, not rewritten.
    - id: gitleaks
      entry: .github/scripts/gitleaks-changes.sh

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.1
  hooks:
    - id: zizmor

- repo: local
  hooks:
    # Humans author commits; AI help is disclosed with one
    # `Assisted-by: <Harness>:<model>` trailer per agent, and no AI agent is the
    # author, committer or a Co-authored-by. Vendored from agent-tooling
    # (hooks/check_ai_attribution.py, with its tests); CI runs it on every
    # commit of a PR or push (lint.yml).
    - id: ai-attribution
      name: AI attribution (Assisted-by trailer, no AI authors)
      language: python
      entry: python .github/scripts/check_ai_attribution.py
      stages: [commit-msg]
