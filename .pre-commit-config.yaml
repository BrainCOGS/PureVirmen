# Run with prek (https://github.com/j178/prek) or pre-commit:
#   uv tool install prek && prek install && prek run --all-files
#
# This repo is mostly MATLAB, so there are no formatters or whitespace fixers:
# the hooks look for secrets, merge conflict markers, and workflow problems, and
# change no files.
default_stages: [pre-commit, pre-merge-commit, manual]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-merge-conflict
    - id: check-case-conflict

- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
    # Scans only the changes being introduced: the staged changes (or a
    # merge's own changes) on commit, the commits of the PR in CI (lint.yml).
    # Older commits hold known findings that are rotated, not rewritten.
    - id: gitleaks
      entry: .github/scripts/gitleaks-changes.sh

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.1
  hooks:
    - id: zizmor
